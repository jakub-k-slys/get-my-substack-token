name: Dependabot
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-approve:
    name: Approve PR
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GET_SUBSTACK_TOKEN_WRITE }}
      - name: Approve a PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GET_SUBSTACK_TOKEN_WRITE }}

  auto-merge:
    name: Merge PR
    needs:
      - auto-approve
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GET_SUBSTACK_TOKEN_WRITE }}
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GET_SUBSTACK_TOKEN_WRITE }}
